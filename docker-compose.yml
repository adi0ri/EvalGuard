name: evalguard

x-app-environment: &app-environment
  # Containers use Compose DNS names. Host-run commands use the localhost URLs
  # documented in .env.example instead.
  EVALGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evalguard}:${POSTGRES_PASSWORD:-evalguard}@postgres:5432/${POSTGRES_DB:-evalguard}
  EVALGUARD_REDIS_URL: redis://redis:6379/0
  EVALGUARD_ENVIRONMENT: ${EVALGUARD_ENVIRONMENT:-development}
  EVALGUARD_LOG_LEVEL: ${EVALGUARD_LOG_LEVEL:-INFO}
  EVALGUARD_QUEUE_NAME: ${EVALGUARD_QUEUE_NAME:-evalguard}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: evalguard:local
  environment: *app-environment

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evalguard}
      POSTGRES_USER: ${POSTGRES_USER:-evalguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalguard}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  test-db:
    <<: *app
    command: ["python", "-m", "evalguard.cli", "prepare-test-db"]
    environment:
      <<: *app-environment
      EVALGUARD_TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evalguard}:${POSTGRES_PASSWORD:-evalguard}@postgres:5432/evalguard_test
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "evalguard.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${EVALGUARD_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      test-db:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "evalguard.workers.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      test-db:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
