name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

  test:
    name: Migrate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVALGUARD_DATABASE_URL: postgresql+psycopg://evalguard:evalguard@localhost:5432/evalguard_test
      EVALGUARD_TEST_DATABASE_URL: postgresql+psycopg://evalguard:evalguard@localhost:5432/evalguard_test
      EVALGUARD_TEST_REDIS_URL: redis://localhost:6379/15
      EVALGUARD_TEST_QUEUE_NAME: evalguard-tests
      EVALGUARD_ENVIRONMENT: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evalguard_test
          POSTGRES_USER: evalguard
          POSTGRES_PASSWORD: evalguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evalguard -d evalguard_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Upgrade a fresh PostgreSQL database
        run: uv run alembic upgrade head

      - name: Verify models match the migrated schema
        run: uv run alembic check

      - name: Run pytest
        run: uv run pytest

  containers:
    name: Verify Docker and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Compose application images
        run: docker compose build migrate test-db api worker
